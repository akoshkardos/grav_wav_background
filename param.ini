[integration]
log_f_low = -6
log_f_high = 4
N_freq = 100

max_z = 8
N_int = 20

[physics]
SFH_num = 6
# leave empty string if SFH != 6
SFH_type = MZ19

# if True, loops over all 6 metallicities. If False, uses the metallicity specified below
# z0005 has only been simulated for BH, so if WD is selected it will skip over this
loop_over_metallicity=true
# ignored if metallicity is being looped over
metallicity = z02         

#select compact object, BH or WD.          
object = BH
pop_synth = AlphaAlpha
alpha = Alpha

[files]
use_data_Seppe = false
ri_file = z_at_age.txt.gz

[settings]
# for example set GA4Z for clarity when using GammaAlpha with Alpha = 4 and int mode redshift
tag = AA4T
integration_mode = time


# uncomment below if you want a custom output path.
# The output path has to be the FULL path OR the path relative to src/; i.e. default is ../output/GWBs/.
# output_path = /path/to/directory/

save_datafile = true
save_figures = false
debug = false
test_for_one = false

[postproc]
# compare selected object to 1 middle z line of other object
compare = false
# choose individual z to show
zfig =
save_pp_figures = true
# show figures with data used for SN24 (use tag example_T or example_z) or HN24
subfolder =
